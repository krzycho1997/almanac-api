framework:
    messenger:
        failure_transport: failed

        transports:
            async:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                options:
                    queue_name: async
                    redeliver_timeout: 300
                retry_strategy:
                    service: App\Briefing\MessageHandler\PrefetchRetryStrategy
            failed:
                dsn: 'doctrine://default?auto_setup=0'
                options:
                    queue_name: failed
                retry_strategy:
                    max_retries: 3
                    delay: 1000
                    multiplier: 4

when@test:
    framework:
        messenger:
            transports:
                async: 'in-memory://?serialize=true'
