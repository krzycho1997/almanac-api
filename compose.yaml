x-php: &php
  security_opt:
    - no-new-privileges:true
  build:
    context: .
    target: dev
  image: localhost/almanac-php:dev
  volumes:
    - .:/srv/app:z

services:
  nginx:
    security_opt:
      - no-new-privileges:true
    image: docker.io/library/nginx:1.30-alpine
    environment:
      NGINX_ENTRYPOINT_LOCAL_RESOLVERS: "1"
      NGINX_ENVSUBST_FILTER: ^NGINX_
    depends_on:
      php:
        condition: service_healthy
    ports:
      - "127.0.0.1:${HTTP_PORT:-8080}:80"
    volumes:
      - ./docker/nginx/templates/default.conf.template:/etc/nginx/templates/default.conf.template:ro,z
      - ./docker/nginx/security-headers.conf:/etc/nginx/snippets/security-headers.conf:ro,z
      - ./docker/nginx/request-id.conf:/etc/nginx/snippets/request-id.conf:ro,z
      - ./docker/nginx/problem.conf:/etc/nginx/snippets/problem.conf:ro,z
      - ./public:/srv/app/public:ro,z

  php:
    <<: *php
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1', 9000) ? 0 : 1);"]
      interval: 2s
      timeout: 3s
      retries: 3
      start_period: 300s

  worker:
    <<: *php
    command: ["bin/console", "messenger:consume", "async", "--time-limit=3600", "--memory-limit=128M"]
    depends_on:
      php:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 15s

  redocly:
    security_opt:
      - no-new-privileges:true
    profiles: [tools]
    image: docker.io/redocly/cli:2.82.0@sha256:18f9991c467e8ac74e3df035aef788a20e1aa0b44df374fef840a1230835e8d6
    working_dir: /spec
    volumes:
      - .:/spec:ro,z

  database:
    security_opt:
      - no-new-privileges:true
    image: docker.io/library/postgres:18-alpine
    environment:
      POSTGRES_DB: almanac
      POSTGRES_USER: almanac
      POSTGRES_PASSWORD: almanac
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U almanac -d almanac"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - database_data:/var/lib/postgresql

  redis:
    security_opt:
      - no-new-privileges:true
    image: docker.io/library/redis:8-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "64mb", "--maxmemory-policy", "volatile-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  prometheus:
    security_opt:
      - no-new-privileges:true
    profiles: [monitoring]
    image: docker.io/prom/prometheus:v3.15.1@sha256:fa3302279710be2f21a8301ec17a8b4f2301fd829bd113839b3b6b02b6f191a2
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus", "--storage.tsdb.retention.time=30d"]
    depends_on:
      - nginx
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./docker/prometheus:/etc/prometheus:ro,z
      - prometheus_data:/prometheus

  grafana:
    security_opt:
      - no-new-privileges:true
    profiles: [monitoring]
    image: docker.io/grafana/grafana:13.2.6@sha256:b21409d7951ddcfd63a4b49083e4ef2cc35bc1437d071813bf82bfb238b00bca
    depends_on:
      - prometheus
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/almanac.json
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro,z
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro,z

volumes:
  database_data:
  prometheus_data:
