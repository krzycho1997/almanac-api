x-php: &php
  security_opt:
    - no-new-privileges:true
  build:
    context: .
    target: dev
  image: localhost/almanac-php:dev
  volumes:
    - .:/srv/app:z

services:
  nginx:
    security_opt:
      - no-new-privileges:true
    image: docker.io/library/nginx:1.30-alpine
    depends_on:
      php:
        condition: service_healthy
    ports:
      - "127.0.0.1:${HTTP_PORT:-8080}:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro,z
      - ./docker/nginx/security-headers.conf:/etc/nginx/snippets/security-headers.conf:ro,z
      - ./docker/nginx/request-id.conf:/etc/nginx/snippets/request-id.conf:ro,z
      - ./docker/nginx/problem.conf:/etc/nginx/snippets/problem.conf:ro,z
      - ./public:/srv/app/public:ro,z

  php:
    <<: *php
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1', 9000) ? 0 : 1);"]
      interval: 2s
      timeout: 3s
      retries: 3
      start_period: 300s

  worker:
    <<: *php
    command: ["bin/console", "messenger:consume", "async", "--time-limit=3600", "--memory-limit=128M"]
    depends_on:
      php:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 15s

  redocly:
    security_opt:
      - no-new-privileges:true
    profiles: [tools]
    image: docker.io/redocly/cli:2.76.0@sha256:bd2a1637e39de2d7fc403b3a114b6f8ecbb7edcb6f814516c79b38be409747e9
    working_dir: /spec
    volumes:
      - .:/spec:ro,z

  database:
    security_opt:
      - no-new-privileges:true
    image: docker.io/library/postgres:18-alpine
    environment:
      POSTGRES_DB: almanac
      POSTGRES_USER: almanac
      POSTGRES_PASSWORD: almanac
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U almanac -d almanac"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - database_data:/var/lib/postgresql

  redis:
    security_opt:
      - no-new-privileges:true
    image: docker.io/library/redis:8-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  database_data:
