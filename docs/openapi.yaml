openapi: 3.0.3
info:
  title: Almanac API
  version: 1.0.0
  description: Daily briefing of NASA's Astronomy Picture of the Day, events from Wikipedia's On This Day and the weather, with bookmarks.
  license:
    name: Proprietary
    url: https://github.com/krzycho1997/almanac-api
servers:
  - url: /
    description: The host that serves this document
  - url: http://127.0.0.1:8080
    description: Local Docker Compose stack
tags:
  - name: bookmark
    description: Discoveries the user keeps, behind a Bearer token
  - name: briefing
    description: Daily briefing for a date
  - name: docs
    description: This API description
  - name: health
    description: Liveness of the application
paths:
  /api/health:
    get:
      operationId: getHealth
      summary: Report that the application is up
      description: Answers 200 with status ok whenever the application can answer, with the state of each source's circuit breaker as Redis holds it; an open circuit never changes the status code, and while Redis is unreachable every circuit is reported closed. Nothing is cached, and only a failure of the application itself answers 500.
      tags: [health]
      security: []
      responses:
        '200':
          description: The application is up.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
              examples:
                everyCircuitClosed:
                  summary: Every source is reachable
                  value:
                    status: ok
                    checks:
                      circuits:
                        apod: closed
                        onThisDay: closed
                        weather: closed
                weatherCircuitOpen:
                  summary: 'Open-Meteo keeps failing, so its circuit is open; the status stays ok'
                  value:
                    status: ok
                    checks:
                      circuits:
                        apod: closed
                        onThisDay: closed
                        weather: open
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/docs.json:
    get:
      operationId: getOpenApiDocument
      summary: Serve this OpenAPI document as JSON
      description: This document as JSON, converted from docs/openapi.yaml on each request so it never differs from the file the tests validate against. Clients may cache it for five minutes; only a failure of the application answers 500.
      tags: [docs]
      security: []
      externalDocs:
        description: JSON Schema of OpenAPI 3.0 documents
        url: https://spec.openapis.org/oas/3.0/schema/2024-10-18
      responses:
        '200':
          description: This document, converted from docs/openapi.yaml.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/PublicCache'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenApiDocument'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/briefings/{date}:
    get:
      operationId: getBriefing
      summary: Build the briefing for a date
      description: Combines NASA's Astronomy Picture of the Day, Wikipedia's On This Day and the Open-Meteo weather for the date and place, by default the one in ALMANAC_DEFAULT_LAT and ALMANAC_DEFAULT_LON (Warsaw in .env). Each source's data is stored in PostgreSQL; the picture and On This Day are kept once fetched, the weather is fetched again after an hour until the day is past, and a source that fails is tried again no sooner than ten minutes later and only when its circuit breaker lets calls through, meanwhile serving its last good data marked stale. A source without data is listed in missing and the answer is still 200; it is 502 only when no source has data, 400 for a date that is not a calendar date in Y-m-d, 422 for a date outside the window or invalid coordinates, and 429 above 60 requests a minute from one client.
      tags: [briefing]
      security: []
      parameters:
        - name: date
          in: path
          required: true
          description: Calendar date from 1995-06-16 to 15 days after today, in the application's time zone.
          schema:
            type: string
            format: date
        - name: lat
          in: query
          required: false
          description: Latitude in plain decimal notation, given together with lon; without both the default place is used. Rounded to two decimal places.
          schema:
            type: number
            minimum: -90
            maximum: 90
            example: 52.23
        - name: lon
          in: query
          required: false
          description: Longitude in plain decimal notation, given together with lat. Rounded to two decimal places.
          schema:
            type: number
            minimum: -180
            maximum: 180
            example: 21.01
      responses:
        '200':
          description: The briefing, with the status of every source.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Briefing'
              examples:
                everySourceOk:
                  summary: 'Warsaw, the default place, with every source; each list trimmed to two of its items'
                  value:
                    date: '2024-03-15'
                    location:
                      latitude: 52.23
                      longitude: 21.01
                      name: Warsaw
                      isDefault: true
                    sources:
                      apod:
                        status: ok
                        fetchedAt: '2026-11-18T12:00:00Z'
                        stale: false
                      onThisDay:
                        status: ok
                        fetchedAt: '2026-11-18T12:00:00Z'
                        stale: false
                      weather:
                        status: ok
                        fetchedAt: '2026-11-18T12:00:00Z'
                        stale: false
                    missing: []
                    apod:
                      discoveryId: c05f9b6a-9262-5859-b45d-743a62e1bc6e
                      title: Portrait of NGC 1055
                      explanation: 'Big, beautiful spiral galaxy NGC 1055 is a dominant member of a small galaxy group a mere 60 million light-years away toward the aquatically intimidating constellation Cetus.'
                      mediaType: image
                      url: 'https://assets.science.nasa.gov/dynamicimage/assets/science/cds/apod/apod/2024/march/Image133k_n1055.jpg?w=2730&h=2298&fit=clip'
                      hdUrl: 'https://assets.science.nasa.gov/dynamicimage/assets/science/cds/apod/apod/2024/march/Image133k_n1055.jpg?w=2730&h=2298&fit=clip'
                      credit: 'Image Credit & Copyright: Dave Doctor'
                    events:
                      - discoveryId: '060e8d09-77b0-5b02-a0d1-bbea0eb215d5'
                        year: 1956
                        text: 'The musical My Fair Lady, based on George Bernard Shaw''s play Pygmalion, debuted at the Mark Hellinger Theatre in New York City.'
                        pages:
                          - title: My Fair Lady
                            url: 'https://en.wikipedia.org/wiki/My_Fair_Lady'
                            thumbnail: 'https://upload.wikimedia.org/wikipedia/en/9/97/Myfairlady.jpg?utm_source=en.wikipedia.org&utm_campaign=api&utm_content=thumbnail_unscaled'
                          - title: George Bernard Shaw
                            url: 'https://en.wikipedia.org/wiki/George_Bernard_Shaw'
                            thumbnail: 'https://thumb.wikimedia.org/wikipedia/en/thumb/3/30/Bernard-Shaw-ILN-1911-original.jpg/330px-Bernard-Shaw-ILN-1911-original.jpg?utm_source=en.wikipedia.org&utm_campaign=api&utm_content=thumbnail'
                      - discoveryId: cbd9124f-65a1-5e62-9be2-d3263e772687
                        year: 1927
                        text: 'In rowing, Oxford defeated Cambridge in the inaugural edition of the Women''s Boat Race.'
                        pages:
                          - title: University of Oxford
                            url: 'https://en.wikipedia.org/wiki/University_of_Oxford'
                            thumbnail: 'https://thumb.wikimedia.org/wikipedia/commons/thumb/e/e4/Arms_of_University_of_Oxford.svg/330px-Arms_of_University_of_Oxford.svg.png?utm_source=en.wikipedia.org&utm_campaign=api&utm_content=thumbnail'
                          - title: University of Cambridge
                            url: 'https://en.wikipedia.org/wiki/University_of_Cambridge'
                            thumbnail: 'https://thumb.wikimedia.org/wikipedia/commons/thumb/c/c3/Coat_of_Arms_of_the_University_of_Cambridge.svg/330px-Coat_of_Arms_of_the_University_of_Cambridge.svg.png?utm_source=en.wikipedia.org&utm_campaign=api&utm_content=thumbnail'
                    births:
                      - discoveryId: '052ba15b-74a1-5beb-a7b2-fb0719c1cce9'
                        year: 1886
                        name: Gerda Wegener
                        description: Danish artist (1886–1940)
                        url: 'https://en.wikipedia.org/wiki/Gerda_Wegener'
                        thumbnail: 'https://thumb.wikimedia.org/wikipedia/commons/thumb/8/87/Gerda_Wegener.jpg/330px-Gerda_Wegener.jpg?utm_source=en.wikipedia.org&utm_campaign=api&utm_content=thumbnail'
                      - discoveryId: '144a7078-7037-5030-802d-79a1fe564b26'
                        year: 1791
                        name: Charles Knight
                        description: English publisher, editor, and author (1791–1873)
                        url: 'https://en.wikipedia.org/wiki/Charles_Knight_(publisher)'
                        thumbnail: 'https://upload.wikimedia.org/wikipedia/commons/f/f2/Charlesknight1860s.JPG?utm_source=en.wikipedia.org&utm_campaign=api&utm_content=thumbnail_unscaled'
                    deaths:
                      - discoveryId: d26fba04-358f-539f-b7c7-340aece53578
                        year: 1575
                        name: Annibale Padovano
                        description: Italian composer
                        url: 'https://en.wikipedia.org/wiki/Annibale_Padovano'
                        thumbnail: null
                      - discoveryId: '30ad2d96-39f2-514a-806e-58f2041d1ce6'
                        year: -44
                        name: Julius Caesar
                        description: Roman general and dictator (100–44 BC)
                        url: 'https://en.wikipedia.org/wiki/Julius_Caesar'
                        thumbnail: 'https://thumb.wikimedia.org/wikipedia/commons/thumb/6/62/Retrato_de_Julio_C%C3%A9sar_%2826724093101%29_%28cropped%29.jpg/330px-Retrato_de_Julio_C%C3%A9sar_%2826724093101%29_%28cropped%29.jpg?utm_source=en.wikipedia.org&utm_campaign=api&utm_content=thumbnail'
                    weather:
                      kind: final
                      timezone: Europe/Warsaw
                      temperatureMin: 1.7
                      temperatureMax: 10.0
                      precipitationSum: 0.0
                      windSpeedMax: 18.5
                      weatherCode: 3
                      description: Overcast
                      sunrise: '2024-03-15T05:49:42+01:00'
                      sunset: '2024-03-15T17:41:12+01:00'
                      daylightDuration: 42700
                    attributions:
                      - source: apod
                        name: Astronomy Picture of the Day
                        url: 'https://apod.nasa.gov/'
                        license: null
                        licenseUrl: null
                        modified: true
                        notice: null
                      - source: onThisDay
                        name: Wikipedia
                        url: 'https://en.wikipedia.org/'
                        license: CC BY-SA 4.0
                        licenseUrl: 'https://creativecommons.org/licenses/by-sa/4.0/'
                        modified: true
                        notice: null
                      - source: weather
                        name: Open-Meteo
                        url: 'https://open-meteo.com/'
                        license: CC BY 4.0
                        licenseUrl: 'https://creativecommons.org/licenses/by/4.0/'
                        modified: true
                        notice: Generated using Copernicus Climate Change Service information
                onThisDayUnavailable:
                  summary: Warsaw while Wikipedia is unavailable, so the lists are empty
                  value:
                    date: '2024-03-15'
                    location:
                      latitude: 52.23
                      longitude: 21.01
                      name: Warsaw
                      isDefault: true
                    sources:
                      apod:
                        status: ok
                        fetchedAt: '2026-11-18T12:00:00Z'
                        stale: false
                      onThisDay:
                        status: failed
                        error: unavailable
                        lastAttemptAt: '2026-11-18T12:00:00Z'
                      weather:
                        status: ok
                        fetchedAt: '2026-11-18T12:00:00Z'
                        stale: false
                    missing:
                      - onThisDay
                    apod:
                      discoveryId: c05f9b6a-9262-5859-b45d-743a62e1bc6e
                      title: Portrait of NGC 1055
                      explanation: 'Big, beautiful spiral galaxy NGC 1055 is a dominant member of a small galaxy group a mere 60 million light-years away toward the aquatically intimidating constellation Cetus.'
                      mediaType: image
                      url: 'https://assets.science.nasa.gov/dynamicimage/assets/science/cds/apod/apod/2024/march/Image133k_n1055.jpg?w=2730&h=2298&fit=clip'
                      hdUrl: 'https://assets.science.nasa.gov/dynamicimage/assets/science/cds/apod/apod/2024/march/Image133k_n1055.jpg?w=2730&h=2298&fit=clip'
                      credit: 'Image Credit & Copyright: Dave Doctor'
                    events: []
                    births: []
                    deaths: []
                    weather:
                      kind: final
                      timezone: Europe/Warsaw
                      temperatureMin: 1.7
                      temperatureMax: 10.0
                      precipitationSum: 0.0
                      windSpeedMax: 18.5
                      weatherCode: 3
                      description: Overcast
                      sunrise: '2024-03-15T05:49:42+01:00'
                      sunset: '2024-03-15T17:41:12+01:00'
