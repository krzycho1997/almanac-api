openapi: 3.0.3
info:
  title: Almanac API
  version: 1.0.0
  description: Daily briefing of NASA's Astronomy Picture of the Day, events from Wikipedia's On This Day and the weather, with bookmarks.
  license:
    name: Proprietary
    url: https://github.com/krzycho1997/almanac-api
servers:
  - url: http://127.0.0.1:8080
    description: Local Docker Compose stack
tags:
  - name: bookmark
    description: Discoveries the user keeps, behind a Bearer token
  - name: briefing
    description: Daily briefing for a date
  - name: health
    description: Liveness of the application
paths:
  /api/health:
    get:
      operationId: getHealth
      summary: Report that the application is up
      tags: [health]
      security: []
      responses:
        '200':
          description: The application is up.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/briefings/{date}:
    get:
      operationId: getBriefing
      summary: Build the briefing for a date
      tags: [briefing]
      security: []
      parameters:
        - name: date
          in: path
          required: true
          description: Calendar date from 1995-06-16 to 15 days after today, in the application's time zone.
          schema:
            type: string
            format: date
        - name: lat
          in: query
          required: false
          description: Latitude in plain decimal notation, given together with lon; without both the default place is used. Rounded to two decimal places.
          schema:
            type: number
            minimum: -90
            maximum: 90
            example: 52.23
        - name: lon
          in: query
          required: false
          description: Longitude in plain decimal notation, given together with lat. Rounded to two decimal places.
          schema:
            type: number
            minimum: -180
            maximum: 180
            example: 21.01
      responses:
        '200':
          description: The briefing, with the status of every source.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Briefing'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          $ref: '#/components/responses/BadGateway'
  /api/bookmarks:
    get:
      operationId: listBookmarks
      summary: List the user's bookmarks, newest first
      tags: [bookmark]
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          required: false
          description: Page from 1; a page after the last one is empty.
          schema:
            type: integer
            minimum: 1
            maximum: 1000000
            default: 1
        - name: limit
          in: query
          required: false
          description: Bookmarks per page.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: One page of bookmarks, newest first, with the counts for paging.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookmarkList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      operationId: createBookmark
      summary: Bookmark a discovery from a briefing
      tags: [bookmark]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBookmark'
      responses:
        '201':
          description: The bookmark, with the discovery it points at.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bookmark'
        '400':
          $ref: '#/components/responses/MalformedBody'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/bookmarks/{id}:
    delete:
      operationId: deleteBookmark
      summary: Remove one of the user's bookmarks
      tags: [bookmark]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: The id of the bookmark as the API returns it, a version 7 UUID in lower case; any other form is a 404.
          schema:
            type: string
            format: uuid
            pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
      responses:
        '204':
          description: The bookmark is gone.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
components:
  headers:
    RequestId:
      description: Id of the request, taken from nginx or the client when it is safe, otherwise generated; also written to every log entry.
      required: true
      schema:
        type: string
        pattern: '^[A-Za-z0-9._-]{1,64}$'
    RetryAfter:
      description: Seconds to wait before the next request is accepted.
      required: true
      schema:
        type: integer
        minimum: 0
    WwwAuthenticate:
      description: Bearer challenge (RFC 6750); a token that is unknown, revoked or expired adds error="invalid_token".
      required: true
      schema:
        type: string
        enum: ['Bearer', 'Bearer error="invalid_token"']
  responses:
    Unauthorized:
      description: The Bearer token is missing, unknown, revoked by a later almanac:user:create or expired.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
        WWW-Authenticate:
          $ref: '#/components/headers/WwwAuthenticate'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    MalformedBody:
      description: The body is not valid JSON.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    UnsupportedMediaType:
      description: The body is not sent as application/json, for example as a form or XML.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: The resource the request points at does not exist, for example a discovery id no briefing produced, or a bookmark that is gone or belongs to another user.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: The user has already bookmarked this discovery.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    BadRequest:
      description: The request is malformed, for example the date is not a calendar date in Y-m-d.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ValidationProblem'
    UnprocessableEntity:
      description: The request is well formed but not allowed, for example a briefing date outside the window, a coordinate that is not a plain decimal in range or comes without its pair, a discovery id that is not a version 5 UUID, or a page or limit that is not a whole number in range.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ValidationProblem'
    TooManyRequests:
      description: The client sent more than 60 briefing requests within a sliding minute. The limit counts every GET and HEAD with a valid date in the briefing window, whatever the date, from one IPv4 address or one IPv6 /64 network; requests rejected for their date are not counted, requests with invalid coordinates are.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    BadGateway:
      description: No source has data for this briefing.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    InternalServerError:
      description: The application failed; the details are only in the logs.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Access token printed once by bin/console almanac:user:create; a later run for the same address revokes it.
  schemas:
    CreateBookmark:
      type: object
      required: [discoveryId]
      properties:
        discoveryId:
          type: string
          format: uuid
          description: The discoveryId of a picture, event or person from a briefing.
    Bookmark:
      type: object
      additionalProperties: false
      required: [id, createdAt, discovery]
      properties:
        id:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
          pattern: 'Z$'
        discovery:
          $ref: '#/components/schemas/Discovery'
    BookmarkList:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Bookmark'
        meta:
          $ref: '#/components/schemas/PaginationMeta'
    PaginationMeta:
      type: object
      additionalProperties: false
      required: [page, limit, total, totalPages]
      properties:
        page:
          type: integer
          minimum: 1
          maximum: 1000000
        limit:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          minimum: 0
        totalPages:
          type: integer
          minimum: 0
    Discovery:
      type: object
      additionalProperties: false
      required: [id, type, date, title, summary, url]
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          enum: [apod, event, person]
        date:
          type: string
          format: date
          nullable: true
          description: The day of the picture or the event; null for a person.
        title:
          type: string
        summary:
          type: string
          nullable: true
        url:
          type: string
          format: uri
          nullable: true
    Briefing:
      type: object
      additionalProperties: false
      required: [date, location, sources, missing, apod, events, births, deaths, weather, attributions]
      properties:
        date:
          type: string
          format: date
        location:
          $ref: '#/components/schemas/Location'
        sources:
          type: object
          additionalProperties: false
          required: [apod, onThisDay, weather]
          properties:
            apod:
              $ref: '#/components/schemas/SourceStatus'
            onThisDay:
              $ref: '#/components/schemas/SourceStatus'
            weather:
              $ref: '#/components/schemas/SourceStatus'
        missing:
          type: array
          description: Sources without data in this briefing.
          uniqueItems: true
          items:
            $ref: '#/components/schemas/SourceKey'
        apod:
          type: object
          allOf:
            - $ref: '#/components/schemas/Apod'
          nullable: true
        events:
          type: array
          description: Selected events of this day in history, in the order Wikipedia lists them; empty when On This Day has no data.
          items:
            $ref: '#/components/schemas/Event'
        births:
          type: array
          description: People born on this day, spread across the centuries and newest first; empty when On This Day has no data.
          items:
            $ref: '#/components/schemas/Person'
        deaths:
          type: array
          description: People who died on this day, spread across the centuries and newest first; empty when On This Day has no data.
          items:
            $ref: '#/components/schemas/Person'
        weather:
          type: object
          allOf:
            - $ref: '#/components/schemas/Weather'
          nullable: true
        attributions:
          type: array
          description: Credits that the sources' licences require next to their data, one for each source with data in this briefing, in the order of sources.
          items:
            $ref: '#/components/schemas/Attribution'
    Location:
      type: object
      additionalProperties: false
      required: [latitude, longitude, name, isDefault]
      properties:
        latitude:
          type: number
          minimum: -90
          maximum: 90
        longitude:
          type: number
          minimum: -180
          maximum: 180
        name:
          type: string
          nullable: true
        isDefault:
          type: boolean
    SourceKey:
      type: string
      enum: [apod, onThisDay, weather]
    SourceStatus:
      type: object
      oneOf:
        - $ref: '#/components/schemas/SourceOk'
        - $ref: '#/components/schemas/SourceFailed'
        - $ref: '#/components/schemas/SourceNotApplicable'
      discriminator:
        propertyName: status
        mapping:
          ok: '#/components/schemas/SourceOk'
          failed: '#/components/schemas/SourceFailed'
          not_applicable: '#/components/schemas/SourceNotApplicable'
    SourceOk:
      type: object
      additionalProperties: false
      description: The source has data. When its last refresh failed, the data is the last good one, marked stale, with the error and the time of that attempt.
      required: [status, fetchedAt, stale]
      properties:
        status:
          type: string
          enum: [ok]
        fetchedAt:
          type: string
          format: date-time
          pattern: 'Z$'
        stale:
          type: boolean
        error:
          type: string
          description: Why the last refresh failed; present only when stale; new values may be added.
          enum: [unavailable, rate_limited, rejected, misconfigured, invalid_payload]
        lastAttemptAt:
          type: string
          format: date-time
          pattern: 'Z$'
          description: When the failed refresh was attempted; present only when stale.
    SourceFailed:
      type: object
      additionalProperties: false
      required: [status, error, lastAttemptAt]
      properties:
        status:
          type: string
          enum: [failed]
        error:
          type: string
          description: Why the source has no fresh data; new values may be added.
          enum: [unavailable, rate_limited, rejected, misconfigured, invalid_payload]
        lastAttemptAt:
          type: string
          format: date-time
          pattern: 'Z$'
    SourceNotApplicable:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [not_applicable]
    Apod:
      type: object
      additionalProperties: false
      required: [discoveryId, title, explanation, mediaType, url, hdUrl, credit]
      properties:
        discoveryId:
          type: string
          format: uuid
          description: Stable id of this item; the same item gets the same id in every briefing.
          example: 2ed6657d-e927-568b-95e1-2665a8aea6a2
        title:
          type: string
        explanation:
          type: string
        mediaType:
          type: string
          enum: [image, video, other]
        url:
          type: string
          format: uri
          nullable: true
        hdUrl:
          type: string
          format: uri
          nullable: true
        credit:
          type: string
          nullable: true
    Event:
      type: object
      additionalProperties: false
      required: [discoveryId, year, text, pages]
      properties:
        discoveryId:
          type: string
          format: uuid
          description: Stable id of this item; the same item gets the same id in every briefing.
          example: 2ed6657d-e927-568b-95e1-2665a8aea6a2
        year:
          type: integer
          description: Negative for years BC.
          example: 1990
        text:
          type: string
        pages:
          type: array
          items:
            $ref: '#/components/schemas/Page'
    Person:
      type: object
      additionalProperties: false
      required: [discoveryId, year, name, description, url, thumbnail]
      properties:
        discoveryId:
          type: string
          format: uuid
          description: Stable id of this item; the same item gets the same id in every briefing.
          example: 2ed6657d-e927-568b-95e1-2665a8aea6a2
        year:
          type: integer
          description: Negative for years BC.
          example: 1947
        name:
          type: string
        description:
          type: string
          nullable: true
        url:
          type: string
          format: uri
          nullable: true
          description: The page about the person; null when no page of the entry is about this person.
        thumbnail:
          type: string
          format: uri
          nullable: true
    Page:
      type: object
      additionalProperties: false
      required: [title, url, thumbnail]
      properties:
        title:
          type: string
        url:
          type: string
          format: uri
        thumbnail:
          type: string
          format: uri
          nullable: true
    Weather:
      type: object
      additionalProperties: false
      description: Daily summary for the place, with times in its own time zone; measures without data are null. Each day is summed up with the place's UTC offset of the day the data is fetched, so on dates with the other daylight-saving state the daily window is shifted by an hour.
      required: [kind, timezone, temperatureMin, temperatureMax, precipitationSum, windSpeedMax, weatherCode, description, sunrise, sunset, daylightDuration]
      properties:
        kind:
          type: string
          enum: [final, provisional, forecast]
          description: final for days more than five days before today in UTC, from the reanalysis archive; provisional for the five days before today (the values may still change), forecast from today; days from 1940 up to 14 days ahead.
        timezone:
          type: string
          description: IANA time zone of the place.
          example: Europe/Warsaw
        temperatureMin:
          type: number
          nullable: true
          description: Degrees Celsius.
        temperatureMax:
          type: number
          nullable: true
          description: Degrees Celsius.
        precipitationSum:
          type: number
          nullable: true
          minimum: 0
          description: Millimetres.
        windSpeedMax:
          type: number
          nullable: true
          minimum: 0
          description: Kilometres per hour.
        weatherCode:
          type: integer
          nullable: true
          description: WMO weather interpretation code.
        description:
          type: string
          nullable: true
          example: Overcast
        sunrise:
          type: string
          format: date-time
          nullable: true
          description: Local time with offset; null when the sun does not rise and set that day.
          example: '2024-07-01T05:51:31+02:00'
        sunset:
          type: string
          format: date-time
          nullable: true
          description: Local time with offset, possibly after midnight; null when the sun does not rise and set that day.
          example: '2024-07-01T21:57:45+02:00'
        daylightDuration:
          type: integer
          nullable: true
          minimum: 0
          maximum: 86400
          description: Seconds of daylight; 0 in polar night, 86400 in polar day.
    Attribution:
      type: object
      additionalProperties: false
      description: Credit that a source's licence or terms require next to its data.
      required: [source, name, url, license, licenseUrl, modified, notice]
      properties:
        source:
          $ref: '#/components/schemas/SourceKey'
        name:
          type: string
          example: Open-Meteo
        url:
          type: string
          format: uri
          example: https://open-meteo.com/
        license:
          type: string
          nullable: true
          description: Null when the data comes without a named licence.
          example: CC BY 4.0
        licenseUrl:
          type: string
          format: uri
          nullable: true
          example: https://creativecommons.org/licenses/by/4.0/
        modified:
          type: boolean
          description: True when the data was changed, for example trimmed, cleaned of markup or converted to the place's time zone.
        notice:
          type: string
          nullable: true
          description: Further acknowledgement the original data requires.
          example: Generated using Copernicus Climate Change Service information
    Health:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
    Problem:
      description: Problem Details (RFC 9457) without internals.
      type: object
      additionalProperties: false
      required: [type, title, status, detail]
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        instance:
          type: string
    ValidationProblem:
      description: Problem Details (RFC 9457) for invalid input, with one entry per violated rule.
      type: object
      additionalProperties: false
      required: [type, title, status, detail, violations]
      properties:
        type:
          type: string
          enum: ['https://symfony.com/errors/validation']
        title:
          type: string
        status:
          type: integer
          enum: [400, 422]
        detail:
          type: string
        violations:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/Violation'
    Violation:
      type: object
      additionalProperties: false
      required: [propertyPath, title, template, parameters, type]
      properties:
        propertyPath:
          type: string
        title:
          type: string
        template:
          type: string
        parameters:
          type: object
          additionalProperties:
            type: string
        type:
          type: string
          description: urn:uuid of the violated constraint's error code.
          pattern: '^urn:uuid:[0-9a-f-]{36}$'
