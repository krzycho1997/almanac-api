        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          $ref: '#/components/responses/BadGateway'
  /api/bookmarks:
    get:
      operationId: listBookmarks
      summary: List the user's bookmarks, newest first
      description: Pages through the bookmarks of the user the Bearer token belongs to, newest first, each with the discovery it points at as the briefing stored it. nginx adds the header Cache-Control no-store, so nothing is cached. 401 without a valid token, 422 for a page or limit that is not a whole number in range.
      tags: [bookmark]
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          required: false
          description: Page from 1; a page after the last one is empty.
          schema:
            type: integer
            minimum: 1
            maximum: 1000000
            default: 1
        - name: limit
          in: query
          required: false
          description: Bookmarks per page.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: One page of bookmarks, newest first, with the counts for paging.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookmarkList'
              examples:
                twoBookmarks:
                  summary: 'The bookmarks of a user who kept a person and a picture from the briefing of 2024-03-15'
                  value:
                    data:
                      - id: '01a1fcbb-27c3-7de8-b46d-34ff422b393c'
                        createdAt: '2026-11-18T12:00:00Z'
                        discovery:
                          id: '30ad2d96-39f2-514a-806e-58f2041d1ce6'
                          type: person
                          date: null
                          title: Julius Caesar
                          summary: Roman general and dictator (100–44 BC)
                          url: 'https://en.wikipedia.org/wiki/Julius_Caesar'
                      - id: '01a1fcbb-27c1-7a08-a000-896e55ba8cdf'
                        createdAt: '2026-11-18T12:00:00Z'
                        discovery:
                          id: c05f9b6a-9262-5859-b45d-743a62e1bc6e
                          type: apod
                          date: '2024-03-15'
                          title: Portrait of NGC 1055
                          summary: 'Big, beautiful spiral galaxy NGC 1055 is a dominant member of a small galaxy group a mere 60 million light-years away toward the aquatically intimidating constellation Cetus. Seen edge-on, the island universe spans over 100,000 light-years, a little larger than our own Milky Way galaxy. The colorful, spiky stars decorating this cosmic portrait of NGC 1055 are in the foreground, well within the Milky Way. But the telltale pinkish star forming regions are scattered through winding dust lanes along the distant galaxy''s thin disk. With a smattering of even more distant background galaxies, the deep image also reveals a boxy halo that extends far above and below the central bulge and disk of NGC 1055. The halo itself is laced with faint, narrow structures, and could represent the mixed and spread out debris from a satellite galaxy disrupted by the larger spiral some 10 billion years ago.'
                          url: 'https://assets.science.nasa.gov/dynamicimage/assets/science/cds/apod/apod/2024/march/Image133k_n1055.jpg?w=2730&h=2298&fit=clip'
                    meta:
                      page: 1
                      limit: 20
                      total: 2
                      totalPages: 1
                afterTheLastPage:
                  summary: A page after the last one is empty but still counts
                  value:
                    data: []
                    meta:
                      page: 3
                      limit: 2
                      total: 3
                      totalPages: 2
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      operationId: createBookmark
      summary: Bookmark a discovery from a briefing
      description: Bookmarks a picture, event or person by the discoveryId a briefing gave it, and answers with the bookmark and its discovery; nginx adds the header Cache-Control no-store, so nothing is cached. 400 when the body is not valid JSON, 415 when it is not sent as application/json, 422 when discoveryId is missing or not a version 5 UUID or the body has any other field, 404 when no briefing produced that id and 409 when the user has already bookmarked it.
      tags: [bookmark]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBookmark'
            examples:
              person:
                summary: 'Bookmark Julius Caesar from the deaths of 2024-03-15'
                value:
                  discoveryId: '30ad2d96-39f2-514a-806e-58f2041d1ce6'
      responses:
        '201':
          description: The bookmark, with the discovery it points at.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bookmark'
              examples:
                person:
                  summary: The new bookmark with the discovery it points at
                  value:
                    id: '01a1fcbb-27c3-7de8-b46d-34ff422b393c'
                    createdAt: '2026-11-18T12:00:00Z'
                    discovery:
                      id: '30ad2d96-39f2-514a-806e-58f2041d1ce6'
                      type: person
                      date: null
                      title: Julius Caesar
                      summary: Roman general and dictator (100–44 BC)
                      url: 'https://en.wikipedia.org/wiki/Julius_Caesar'
        '400':
          $ref: '#/components/responses/MalformedBody'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/bookmarks/{id}:
    delete:
      operationId: deleteBookmark
      summary: Remove one of the user's bookmarks
      description: Deletes the bookmark for good. The answer is 404, never 403, when the id is not a lower-case version 7 UUID, the bookmark does not exist or it belongs to another user, so ids of other users' bookmarks reveal nothing; a malformed id answers 404 even without a token. nginx adds the header Cache-Control no-store, so nothing is cached.
      tags: [bookmark]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: The id of the bookmark as the API returns it, a version 7 UUID in lower case; any other form is a 404.
          schema:
            type: string
            format: uuid
            pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
      responses:
        '204':
          description: The bookmark is gone.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
components:
  headers:
    RequestId:
      description: Id of the request, taken from nginx or the client when it is safe, otherwise generated; also written to every log entry.
      required: true
      schema:
        type: string
        pattern: '^[A-Za-z0-9._-]{1,64}$'
    PublicCache:
      description: Shared caches may keep the document for five minutes.
      required: true
      schema:
        type: string
        enum: ['max-age=300, public']
    RetryAfter:
      description: Seconds to wait before the next request is accepted.
      required: true
      schema:
        type: integer
        minimum: 0
    WwwAuthenticate:
      description: Bearer challenge (RFC 6750); a token that is unknown, revoked or expired adds error="invalid_token".
      required: true
      schema:
        type: string
        enum: ['Bearer', 'Bearer error="invalid_token"']
  responses:
    Unauthorized:
      description: The Bearer token is missing, unknown, revoked by a later almanac:user:create or expired.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
        WWW-Authenticate:
          $ref: '#/components/headers/WwwAuthenticate'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            missingToken:
              summary: No Authorization header, or a token that is unknown, revoked or expired
              value:
                type: 'https://tools.ietf.org/html/rfc2616#section-10'
                title: An error occurred
                status: 401
                detail: Unauthorized
    MalformedBody:
      description: The body is not valid JSON.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            truncatedJson:
              summary: The body ends in the middle of a JSON object
              value:
                type: 'https://tools.ietf.org/html/rfc2616#section-10'
                title: An error occurred
                status: 400
                detail: Bad Request
    UnsupportedMediaType:
      description: The body is not sent as application/json, for example as a form or XML.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            formBody:
              summary: The body is sent as a form
              value:
                type: 'https://tools.ietf.org/html/rfc2616#section-10'
                title: An error occurred
                status: 415
                detail: Unsupported Media Type
    NotFound:
      description: The resource the request points at does not exist, for example a discovery id no briefing produced, or a bookmark that is gone or belongs to another user.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            unknownDiscovery:
              summary: No briefing produced this discovery id
              value:
                type: 'https://tools.ietf.org/html/rfc2616#section-10'
                title: An error occurred
                status: 404
                detail: Not Found
    Conflict:
      description: The user has already bookmarked this discovery.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            alreadyBookmarked:
              summary: The user bookmarks the same discovery a second time
              value:
                type: 'https://tools.ietf.org/html/rfc2616#section-10'
                title: An error occurred
                status: 409
                detail: Conflict
    BadRequest:
      description: The request is malformed, for example the date is not a calendar date in Y-m-d.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ValidationProblem'
          examples:
            notACalendarDate:
              summary: 'GET /api/briefings/2026-02-30'
              value:
                type: 'https://symfony.com/errors/validation'
                title: Validation Failed
                status: 400
                detail: 'date: This value is not a valid date.'
                violations:
                  - propertyPath: date
                    title: This value is not a valid date.
                    template: This value is not a valid date.
                    parameters:
                      '{{ value }}': '"2026-02-30"'
                    type: 'urn:uuid:3c184ce5-b31d-4de7-8b76-326da7b2be93'
    UnprocessableEntity:
      description: The request is well formed but not allowed, for example a briefing date outside the window, a coordinate that is not a plain decimal in range or comes without its pair, a discovery id that is not a version 5 UUID, or a page or limit that is not a whole number in range.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ValidationProblem'
          examples:
            dateOutsideTheWindow:
              summary: 'GET /api/briefings/2026-12-04 on 2026-11-18'
              value:
                type: 'https://symfony.com/errors/validation'
                title: Validation Failed
                status: 422
                detail: 'date: The date must be between 1995-06-16 and 15 days after today.'
                violations:
                  - propertyPath: date
                    title: 'The date must be between 1995-06-16 and 15 days after today.'
                    template: 'The date must be between 1995-06-16 and 15 days after today.'
                    parameters:
                      '{{ value }}': 'Dec 4, 2026, 12:00 AM'
                      '{{ min }}': 'Jun 16, 1995, 12:00 AM'
                      '{{ max }}': 'Dec 3, 2026, 12:00 AM'
                    type: 'urn:uuid:04b91c99-a946-4221-afc5-e65ebac401eb'
            coordinateNotPlainDecimal:
              summary: 'GET /api/briefings/2024-03-15?lat=1e1&lon=21.01'
              value:
                type: 'https://symfony.com/errors/validation'
                title: Validation Failed
                status: 422
                detail: 'lat: This value should be a number in plain decimal notation.'
                violations:
                  - propertyPath: lat
                    title: This value should be a number in plain decimal notation.
                    template: This value should be a number in plain decimal notation.
                    parameters:
                      '{{ value }}': '"1e1"'
                      '{{ pattern }}': '/^-?\d{1,3}(\.\d+)?$/D'
                    type: 'urn:uuid:de1e3db3-5ed4-4941-aae4-59f3667cc3a3'
            discoveryIdNotVersion5:
              summary: POST /api/bookmarks with a version 7 UUID as discoveryId
              value:
                type: 'https://symfony.com/errors/validation'
                title: Validation Failed
                status: 422
                detail: 'discoveryId: This is not a valid UUID.'
                violations:
                  - propertyPath: discoveryId
                    title: This is not a valid UUID.
                    template: This is not a valid UUID.
                    parameters:
                      '{{ value }}': '"019ad6a4-2c3e-7b1f-8a2d-4e5f6a7b8c9d"'
                    type: 'urn:uuid:21ba13b4-b185-4882-ac6f-d147355987eb'
            pageNotWholeNumber:
              summary: 'GET /api/bookmarks?page=-1'
              value:
                type: 'https://symfony.com/errors/validation'
                title: Validation Failed
                status: 422
                detail: 'page: This value is not valid.'
                violations:
                  - propertyPath: page
                    title: This value is not valid.
                    template: This value is not valid.
                    parameters:
                      '{{ value }}': '"-1"'
                      '{{ pattern }}': '/^\d+$/D'
                    type: 'urn:uuid:de1e3db3-5ed4-4941-aae4-59f3667cc3a3'
    TooManyRequests:
      description: The client sent more than 60 briefing requests within a sliding minute. The limit counts every GET and HEAD with a valid date in the briefing window, whatever the date, from one IPv4 address or one IPv6 /64 network; requests rejected for their date are not counted, requests with invalid coordinates are.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            overTheLimit:
              summary: The 61st briefing request within a minute
              value:
                type: 'https://tools.ietf.org/html/rfc2616#section-10'
                title: An error occurred
                status: 429
                detail: Too Many Requests
    BadGateway:
      description: No source has data for this briefing.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            noSourceHasData:
              summary: Every source failed and none has stored data for the day
              value:
                type: 'https://tools.ietf.org/html/rfc2616#section-10'
                title: An error occurred
                status: 502
                detail: Bad Gateway
    InternalServerError:
      description: The application failed; the details are only in the logs.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Access token printed once by bin/console almanac:user:create; a later run for the same address revokes it.
  schemas:
    CreateBookmark:
      type: object
      additionalProperties: false
      required: [discoveryId]
      properties:
        discoveryId:
          type: string
          format: uuid
          description: The discoveryId of a picture, event or person from a briefing.
    Bookmark:
      type: object
      additionalProperties: false
      required: [id, createdAt, discovery]
      properties:
        id:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
          pattern: 'Z$'
        discovery:
          $ref: '#/components/schemas/Discovery'
    BookmarkList:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Bookmark'
        meta:
          $ref: '#/components/schemas/PaginationMeta'
    PaginationMeta:
      type: object
      additionalProperties: false
      required: [page, limit, total, totalPages]
      properties:
        page:
          type: integer
          minimum: 1
          maximum: 1000000
        limit:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          minimum: 0
        totalPages:
          type: integer
          minimum: 0
    Discovery:
      type: object
      additionalProperties: false
      required: [id, type, date, title, summary, url]
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          enum: [apod, event, person]
        date:
          type: string
          format: date
          nullable: true
          description: The day of the picture or the event; null for a person.
        title:
          type: string
        summary:
          type: string
          nullable: true
        url:
          type: string
          format: uri
          nullable: true
    Briefing:
      type: object
      additionalProperties: false
      required: [date, location, sources, missing, apod, events, births, deaths, weather, attributions]
      properties:
        date:
          type: string
          format: date
        location:
          $ref: '#/components/schemas/Location'
        sources:
          type: object
          additionalProperties: false
          required: [apod, onThisDay, weather]
          properties:
            apod:
              $ref: '#/components/schemas/SourceStatus'
            onThisDay:
              $ref: '#/components/schemas/SourceStatus'
            weather:
              $ref: '#/components/schemas/SourceStatus'
        missing:
          type: array
          description: Sources without data in this briefing.
          uniqueItems: true
          items:
            $ref: '#/components/schemas/SourceKey'
        apod:
          type: object
          allOf:
            - $ref: '#/components/schemas/Apod'
          nullable: true
        events:
          type: array
          description: Selected events of this day in history, in the order Wikipedia lists them; empty when On This Day has no data.
          items:
            $ref: '#/components/schemas/Event'
        births:
          type: array
          description: People born on this day, spread across the centuries and newest first; empty when On This Day has no data.
          items:
            $ref: '#/components/schemas/Person'
        deaths:
          type: array
          description: People who died on this day, spread across the centuries and newest first; empty when On This Day has no data.
          items:
            $ref: '#/components/schemas/Person'
        weather:
          type: object
          allOf:
            - $ref: '#/components/schemas/Weather'
          nullable: true
        attributions:
          type: array
          description: Credits that the sources' licences require next to their data, one for each source with data in this briefing, in the order of sources.
          items:
            $ref: '#/components/schemas/Attribution'
    Location:
      type: object
      additionalProperties: false
      required: [latitude, longitude, name, isDefault]
      properties:
        latitude:
          type: number
          minimum: -90
          maximum: 90
        longitude:
          type: number
          minimum: -180
          maximum: 180
        name:
          type: string
          nullable: true
        isDefault:
          type: boolean
    SourceKey:
      type: string
      enum: [apod, onThisDay, weather]
    SourceStatus:
      type: object
      oneOf:
        - $ref: '#/components/schemas/SourceOk'
        - $ref: '#/components/schemas/SourceFailed'
        - $ref: '#/components/schemas/SourceNotApplicable'
      discriminator:
        propertyName: status
        mapping:
          ok: '#/components/schemas/SourceOk'
          failed: '#/components/schemas/SourceFailed'
          not_applicable: '#/components/schemas/SourceNotApplicable'
    SourceOk:
      type: object
      additionalProperties: false
      description: The source has data. When its last refresh failed, the data is the last good one, marked stale, with the error and the time of that attempt.
      required: [status, fetchedAt, stale]
      properties:
        status:
          type: string
          enum: [ok]
        fetchedAt:
          type: string
          format: date-time
          pattern: 'Z$'
        stale:
          type: boolean
        error:
          type: string
          description: Why the last refresh failed; present only when stale; new values may be added.
          enum: [unavailable, rate_limited, rejected, misconfigured, invalid_payload]
        lastAttemptAt:
          type: string
          format: date-time
          pattern: 'Z$'
          description: When the failed refresh was attempted, or skipped while the source was unavailable; present only when stale.
    SourceFailed:
      type: object
      additionalProperties: false
      required: [status, error, lastAttemptAt]
      properties:
        status:
          type: string
          enum: [failed]
        error:
          type: string
          description: Why the source has no fresh data; new values may be added.
          enum: [unavailable, rate_limited, rejected, misconfigured, invalid_payload]
        lastAttemptAt:
          type: string
          format: date-time
          pattern: 'Z$'
          description: When the failed refresh was attempted, or skipped while the source was unavailable.
    SourceNotApplicable:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [not_applicable]
    Apod:
      type: object
      additionalProperties: false
      required: [discoveryId, title, explanation, mediaType, url, hdUrl, credit]
      properties:
        discoveryId:
          type: string
          format: uuid
          description: Stable id of this item; the same item gets the same id in every briefing.
          example: 2ed6657d-e927-568b-95e1-2665a8aea6a2
        title:
          type: string
        explanation:
          type: string
        mediaType:
          type: string
          enum: [image, video, other]
        url:
          type: string
          format: uri
          nullable: true
        hdUrl:
          type: string
          format: uri
          nullable: true
        credit:
          type: string
          nullable: true
    Event:
      type: object
      additionalProperties: false
      required: [discoveryId, year, text, pages]
      properties:
        discoveryId:
          type: string
          format: uuid
          description: Stable id of this item; the same item gets the same id in every briefing.
          example: 2ed6657d-e927-568b-95e1-2665a8aea6a2
        year:
          type: integer
          description: Negative for years BC.
          example: 1990
        text:
          type: string
        pages:
          type: array
          items:
            $ref: '#/components/schemas/Page'
    Person:
      type: object
      additionalProperties: false
      required: [discoveryId, year, name, description, url, thumbnail]
      properties:
        discoveryId:
          type: string
          format: uuid
          description: Stable id of this item; the same item gets the same id in every briefing.
          example: 2ed6657d-e927-568b-95e1-2665a8aea6a2
        year:
          type: integer
          description: Negative for years BC.
          example: 1947
        name:
          type: string
        description:
          type: string
          nullable: true
        url:
          type: string
          format: uri
          nullable: true
          description: The page about the person; null when no page of the entry is about this person.
        thumbnail:
          type: string
          format: uri
          nullable: true
    Page:
      type: object
      additionalProperties: false
      required: [title, url, thumbnail]
      properties:
        title:
          type: string
        url:
          type: string
          format: uri
        thumbnail:
          type: string
          format: uri
          nullable: true
    Weather:
      type: object
      additionalProperties: false
      description: Daily summary for the place, with times in its own time zone; measures without data are null. Each day is summed up with the place's UTC offset of the day the data is fetched, so on dates with the other daylight-saving state the daily window is shifted by an hour.
      required: [kind, timezone, temperatureMin, temperatureMax, precipitationSum, windSpeedMax, weatherCode, description, sunrise, sunset, daylightDuration]
      properties:
        kind:
          type: string
          enum: [final, provisional, forecast]
          description: How the data was classified when it was fetched, which a stored past day keeps, since it is not fetched again. final for days more than five days before the fetch in UTC, from the reanalysis archive; provisional for the five days before it (the values could still change), forecast from the day of the fetch; days from 1940 up to 14 days ahead.
        timezone:
          type: string
          description: IANA time zone of the place.
          example: Europe/Warsaw
        temperatureMin:
          type: number
          nullable: true
          description: Degrees Celsius.
        temperatureMax:
          type: number
          nullable: true
          description: Degrees Celsius.
        precipitationSum:
          type: number
          nullable: true
          minimum: 0
          description: Millimetres.
        windSpeedMax:
          type: number
          nullable: true
          minimum: 0
          description: Kilometres per hour.
        weatherCode:
          type: integer
          nullable: true
          description: WMO weather interpretation code.
        description:
          type: string
          nullable: true
          example: Overcast
        sunrise:
          type: string
          format: date-time
          nullable: true
          description: Local time with offset; null when the sun does not rise and set that day.
          example: '2024-07-01T05:51:31+02:00'
        sunset:
          type: string
          format: date-time
          nullable: true
          description: Local time with offset, possibly after midnight; null when the sun does not rise and set that day.
          example: '2024-07-01T21:57:45+02:00'
        daylightDuration:
          type: integer
          nullable: true
          minimum: 0
          maximum: 86400
          description: Seconds of daylight; 0 in polar night, 86400 in polar day.
    Attribution:
      type: object
      additionalProperties: false
      description: Credit that a source's licence or terms require next to its data.
      required: [source, name, url, license, licenseUrl, modified, notice]
      properties:
        source:
          $ref: '#/components/schemas/SourceKey'
        name:
          type: string
          example: Open-Meteo
        url:
          type: string
          format: uri
          example: https://open-meteo.com/
        license:
          type: string
          nullable: true
          description: Null when the data comes without a named licence.
          example: CC BY 4.0
        licenseUrl:
          type: string
          format: uri
          nullable: true
          example: https://creativecommons.org/licenses/by/4.0/
        modified:
          type: boolean
          description: True when the data was changed, for example trimmed, cleaned of markup or converted to the place's time zone.
        notice:
          type: string
          nullable: true
          description: Further acknowledgement the original data requires.
          example: Generated using Copernicus Climate Change Service information
    OpenApiDocument:
      description: An OpenAPI 3.0 document; its full structure is defined by the JSON Schema in externalDocs.
      type: object
      required: [openapi, info, paths]
      properties:
        openapi:
          type: string
          pattern: '^3\.0\.\d+$'
        info:
          type: object
        paths:
          type: object
    Health:
      type: object
      additionalProperties: false
      required: [status, checks]
      properties:
        status:
          description: Always ok while the application answers; the checks describe its dependencies and never change the status code.
          type: string
          enum: [ok]
        checks:
          description: The state each module reports, keyed by the name of its check.
          type: object
          additionalProperties: false
          required: [circuits]
          properties:
            circuits:
              $ref: '#/components/schemas/Circuits'
    Circuits:
      description: The circuit breaker of each source. An open circuit skips the source and serves its last good data; once the opening is over, the circuit is half-open and the first request tries the source once.
      type: object
      additionalProperties: false
      required: [apod, onThisDay, weather]
      properties:
        apod:
          $ref: '#/components/schemas/CircuitState'
        onThisDay:
          $ref: '#/components/schemas/CircuitState'
        weather:
          $ref: '#/components/schemas/CircuitState'
    CircuitState:
      type: string
      enum: [closed, open, half_open]
    Problem:
      description: Problem Details (RFC 9457) without internals.
      type: object
      additionalProperties: false
      required: [type, title, status, detail]
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        instance:
          type: string
    ValidationProblem:
      description: Problem Details (RFC 9457) for invalid input, with one entry per violated rule.
      type: object
      additionalProperties: false
      required: [type, title, status, detail, violations]
      properties:
        type:
          type: string
          enum: ['https://symfony.com/errors/validation']
        title:
          type: string
        status:
          type: integer
          enum: [400, 422]
        detail:
          type: string
        violations:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/Violation'
    Violation:
      type: object
      additionalProperties: false
      required: [propertyPath, title, template, parameters]
      properties:
        propertyPath:
          type: string
        title:
          type: string
        template:
          type: string
        parameters:
          type: object
          additionalProperties:
            type: string
        type:
          type: string
          description: urn:uuid of the violated constraint's error code; absent when the body could not be read into the request at all, such as a field the request does not define.
          pattern: '^urn:uuid:[0-9a-f-]{36}$'
