name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the php image
        run: docker compose build php
      - name: Install dependencies
        run: docker compose run --rm --no-deps -T php composer install --no-interaction --no-progress
      - name: Run fast checks
        run: docker compose run --rm --no-deps -T php composer check:fast
      - name: Lint the OpenAPI description
        run: docker compose run --rm --no-deps redocly lint docs/openapi.yaml
      - name: Check the Prometheus configuration and test the alerts
        run: |
          docker compose --profile monitoring run --rm --no-deps --entrypoint promtool prometheus check config /etc/prometheus/prometheus.yml
          docker compose --profile monitoring run --rm --no-deps --entrypoint promtool prometheus test rules /etc/prometheus/alerts.test.yml
      - name: Build the prod image
        run: docker build --target prod --tag almanac-php:prod .
      - name: Check the prod image
        run: bin/check-prod-image almanac-php:prod

  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Start the stack from a clean checkout
        run: docker compose up --build --wait --wait-timeout 300
      - name: Check the running app
        run: curl --fail-with-body --silent --show-error http://127.0.0.1:8080/api/health
      - name: Check that the app logs carry the request id from nginx
        run: bin/check-request-id-in-logs http://127.0.0.1:8080
      - name: Run all tests
        run: docker compose exec -T php composer test
      - name: Show container state and logs
        if: ${{ !success() }}
        run: |
          docker compose ps --all
          docker compose logs --no-color

  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check commit subjects
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          shas=$(git rev-list --no-merges --perl-regexp --author='^(?!dependabot\[bot\])' "$BASE_SHA..$HEAD_SHA")
          status=0
          for sha in $shas; do
            git log -1 --format=%B "$sha" > "$RUNNER_TEMP/commit-msg"
            .githooks/commit-msg "$RUNNER_TEMP/commit-msg" || status=1
          done
          exit "$status"
      - name: Scan history for secrets
        if: ${{ !cancelled() }}
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo --no-banner --redact
      - name: Lint the Dockerfile
        if: ${{ !cancelled() }}
        run: docker run --rm -v "$PWD:/repo" -w /repo ghcr.io/hadolint/hadolint:v2.15.1 hadolint Dockerfile

  podman:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    env:
      PODMAN_COMPOSE_PROVIDER: podman-compose
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install podman-compose
        run: pipx install podman-compose==1.6.0
      - name: Show the Podman versions
        run: |
          podman version
          podman info --format '{{.Host.NetworkBackend}} {{.Host.CgroupsVersion}} rootless={{.Host.Security.Rootless}}'
          podman compose version
      - name: Start the stack from a clean checkout
        run: podman compose up --build --detach
      - name: Wait for the app
        run: curl --fail-with-body --silent --show-error --retry 60 --retry-delay 5 --retry-all-errors http://127.0.0.1:8080/api/health
      - name: Run the smoke test
        env:
          COMPOSE: podman compose
        run: bin/smoke-test http://127.0.0.1:8080
      - name: Show container state and logs
        if: ${{ !success() }}
        run: |
          podman ps --all
          podman compose logs
      - name: Stop the stack and remove its volumes
        if: ${{ always() }}
        run: podman compose down --volumes
